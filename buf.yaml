# Buf module over the public proto tree. proto_library is the Bazel API;
# this file lets `buf build` / `buf lint` work from the same sources.
version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # These contracts predate AIP-shaped RPCs (ReadFile, PipelineStatus,
    # Resolve, …) and use existing service names (Finder, EventSink,
    # ForgeWrite, ForgeDiscovery). Do not rewrite imported protos here.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - SERVICE_SUFFIX
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
breaking:
  use:
    - FILE
